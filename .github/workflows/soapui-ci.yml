name: run-soapui-tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 11

      - name: Download and install SoapUI
        run: |
          wget https://github.com/hamzanaji123/soapui-ci/releases/download/v2.0/soapUI-light.zip -O soapUI-light.zip
          unzip soapUI-light.zip -d soapui
          chmod +x soapui/soapUI-light/soapUI-light/bin/testrunner.sh

      - name: Run SoapUI Tests
        run: |
         soapui/soapUI-light/soapUI-light/bin/testrunner.sh -s"Cas_Credit" -f"target" Stage-soapui-project.xml

           


  
      - name: Upload Groovy Script Error Log
        if: failure() # Uploader seulement si le workflow échoue
        uses: actions/upload-artifact@v4
        with:
           name: groovy-script-error-log
           path: target/Cas_Credit-Verification_operation_credit-GroovyScript-0-FAILED.txt
