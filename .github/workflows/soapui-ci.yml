name: run-soapui-tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # Permet de déclencher manuellement le workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 11

      - name: Download and install SoapUI
        run: |
          echo "Téléchargement de soapUI-light.zip..."
          wget https://github.com/hamzanaji123/soapui-ci/releases/download/v2.0/soapUI-light.zip -O soapUI-light.zip
          
          echo "Décompression du ZIP dans le dossier 'soapui'..."
          unzip soapUI-light.zip -d soapui
          
          echo "Listing du contenu du dossier 'soapui' (1er niveau) :"
          ls -F soapui/ # Afficher le contenu de soapui/
          
          echo "Listing du contenu du dossier 'soapui/soapUI-light' (2ème niveau) :"
          ls -F soapui/soapUI-light/ # Afficher le contenu de soapui/soapUI-light/
          
          echo "Listing du contenu du dossier 'soapui/soapUI-light/soapUI-light' (3ème niveau) :"
          ls -F soapui/soapUI-light/soapUI-light/ # Afficher le contenu de soapui/soapUI-light/soapUI-light/
          
          echo "Listing du contenu du dossier 'soapui/soapUI-light/soapUI-light/bin' (4ème niveau) :"
          ls -F soapui/soapUI-light/soapUI-light/bin/ # Afficher le contenu de soapui/soapUI-light/soapUI-light/bin/
          
          # Tentative de rendre exécutable et vérification du chemin
          echo "Tentative de rendre testrunner.sh exécutable et vérification du chemin..."
          chmod +x soapui/soapUI-light/soapUI-light/bin/testrunner.sh
          
          # Vérifier si le fichier existe et est exécutable
          if [ -f soapui/soapUI-light/soapUI-light/bin/testrunner.sh ]; then
            echo "testrunner.sh trouvé. Vérification des permissions :"
            ls -l soapui/soapUI-light/soapUI-light/bin/testrunner.sh
          else
            echo "ERREUR: testrunner.sh NON TROUVE au chemin attendu après chmod."
            exit 1 # Arrête le workflow si le fichier n'est pas trouvé
          fi

      - name: Create output directory
        run: mkdir -p target # Crée le dossier 'target' à la racine du dépôt

      - name: Run SoapUI Tests
        run: |
          echo "Exécution des tests SoapUI avec le chemin : soapui/soapUI-light/soapUI-light/bin/testrunner.sh"
          # Utilisation du chemin que nous avons vérifié et qui devrait être correct
          soapui/soapUI-light/soapUI-light/bin/testrunner.sh -s"Cas_Credit" -f"target" Stage-soapui-project.xml
        env:
          # Ajout de ces variables pour aider le débogage de SoapUI
          # Utile si SoapUI lui-même rencontre des problèmes de chemins ou d'accès
          SOAPUI_HOME: ${{ github.workspace }}/soapui/soapUI-light/soapUI-light
          SOAPUI_EXT_LIBS: ${{ github.workspace }}/soapui/soapUI-light/soapUI-light/bin/ext
          JAVA_HOME: /usr/lib/jvm/java-11-temurin # chemin commun sur ubuntu-latest pour temurin 11


      - name: Upload Groovy Script Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: groovy-script-error-log
          # Assure-toi que ce chemin est correct pour tes logs d'erreur Groovy
          path: target/Cas_Credit-Verification_operation_credit-GroovyScript-0-FAILED.txt

      - name: Upload Test Results (JUnit Report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soapui-test-reports
          path: target/*.xml

      - name: Upload Generated Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-excel-report
          # Change ceci si ton fichier Excel a un nom différent
          path: Testing.xlsx # Si Testing.xlsx est modifié et à la racine du dépôt
          # Ou si ton script le génère dans target/
          # path: target/Testing.xlsx